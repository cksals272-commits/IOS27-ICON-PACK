name: Build V3 Android APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Fold8-iOS27-LiquidGlass-V3.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fold8-iOS27-LiquidGlass-V3
          path: dist/Fold8-iOS27-LiquidGlass-V3.apk
          if-no-files-found: error
